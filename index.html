<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Prevents search engines like Google from indexing this page -->
    <meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<title>Crosspoint Creative — Office Calendar v2</title>
<style>
  :root{
    --blue:#0078AE;
    --black:#000000;
    --green:#00B259;
    --charcoal:#35363A;
    --white:#FFFFFF;
    --grid:#B8BDC1;
    --sand:#F7F5EF;
    --navy:#0A3D52;
    --gold:#F2A93B;
    --coral:#EA6E5A;
    --light-teal:#BCE6E3;
    --teal:#00B8B8; /* temporary; replace with corrected brand teal */
  }

  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--white)}
  body{
    font-family: Lato, sans-serif;
    color:var(--black);
    overflow:hidden;
  }

  .screen{
    width:100vw;
    height:100vh;
    min-height:900px;
    display:flex;
    flex-direction:column;
    background:var(--white);
  }

  /* HEADER */
  .header{
    flex:0 0 6%;
    min-height:64px;
    background:var(--black);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .brand{
    width:min(76%, 980px);
    height:78%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:2;
    margin: 0 auto;
  }
  .brand-logo{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
  }


  /* MAIN */
.months{
  flex:1 1 auto;
  min-height:0;
  padding:1.2vh 3.2vw .35vh;
  display:flex;
  flex-direction:column;
  gap:.7vh;
}

  .month{
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .month.current{flex:1.45 1 0}
  .month.future{flex:1 1 0}

.month-title{
  font-family: Arvo, serif;
    font-weight:400;
  font-size:clamp(1.4rem,2.3vw,3.2rem);
  margin:0 0 .35vh;
}

.month.future .month-title{
  font-size:clamp(1.2rem,1.9vw,2.6rem);
}

  .weekday-row,.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .weekday-row{
    background:var(--blue);
    color:white;
    min-height:1.25vh;
    align-items:center;
    border-left:1px solid var(--blue);
    border-right:1px solid var(--blue);
  }
  .weekday{
    text-align:center;
    font-size:clamp(.55rem,1.05vw,1.2rem);
    font-weight:700;
    letter-spacing:.08em;
  }

  .calendar-grid{
    flex:1 1 auto;
    min-height:0;
    border-left:1px solid var(--grid);
    border-top:1px solid var(--grid);
      grid-auto-rows:minmax(0,1fr);
      position:relative;
  }
  .day{
    min-width:0;
    min-height:0;
    position:relative;
    padding:.45vh .35vw;
    border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    overflow:hidden;
    background:white;
  }
  .day.other-month{
    background:#fafafa;
    color:#B8BDC1;
  }
  .day.today{
    background:var(--sand);
    box-shadow:inset 0 0 0 4px var(--blue);
  }
  .day-number{
    font-size:clamp(.8rem,1.45vw,1.8rem);
    font-weight:700;
    line-height:1;
    margin-bottom:.35vh;
  }
    .today-label{
    color:var(--blue);
    font-size:clamp(.42rem,.65vw,.8rem);
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-top:.2vh;
  }

  .event{
    z-index:5;
      border-left:5px solid var(--blue);
    padding:0 .3vw;
display:flex;
align-items:center;
    min-width:0;
margin:.22vh 4px;
    font-size:clamp(.52rem,.92vw,1.05rem);
    line-height:1.1;
    background:#F5F7F8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

    .month.future .event{
  padding:.12vh .2vw;
margin:.1vh 4px;
  font-size:clamp(.42rem,.72vw,.82rem);
  line-height:1;
}

.month.future .day-number{
  font-size:clamp(.65rem,1.1vw,1.25rem);
  margin-bottom:.15vh;
}

.event.leave {
  background:#edf9ef;
  font-weight:700;
}

.multi-span{
  z-index:5;
  margin:.22vh 4px;
min-width:0;

background:#F5F7F8;
  border-left:5px solid var(--blue);

  padding:0 .3vw;
display:flex;
align-items:center;
  font-size:clamp(.52rem,.92vw,1.05rem);
  line-height:1.1;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  pointer-events:none;
}

    .event-content{
  flex:1 1 auto;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.month.future .multi-span{
  padding:.12vh .2vw;
    margin:.1vh 4px;
  font-size:clamp(.42rem,.72vw,.82rem);
  line-height:1;
}
    
.event.meeting{
  border-color:var(--blue);
  background:#E8F3F8;
}

.event.brainstorm{
  border-color:var(--teal);
  background:#E7F5F3;
}

.event.special{
  border-color:var(--light-teal);
  background:#EFF9FA;
}

.event.crosspoint{
  border-color:var(--gold);
  background:#FBF5E6;
}

.event.deadline{
  border-color:var(--coral);
  background:#FCEDEA;
}

.event.leave{
  border-color:var(--green);
  background:#EDF9EF;
}
    .multi-span.meeting{
  border-color:var(--blue);
  background:#E8F3F8;
}

.multi-span.brainstorm{
  border-color:var(--teal);
  background:#E7F5F3;
}

.multi-span.special{
  border-color:var(--light-teal);
  background:#EFF9FA;
}

.multi-span.crosspoint{
  border-color:var(--gold);
  background:#FBF5E6;
}

.multi-span.deadline{
  border-color:var(--coral);
  background:#FCEDEA;
}

.multi-span.leave{
  border-color:var(--green);
  background:#edf9ef;
}
  background:#edf9ef;
}
  .more{
    color:var(--blue);
    font-size:clamp(.42rem,.68vw,.8rem);
    font-weight:700;
    margin-top:.2vh;
  }

  /* FOOTER */
.footer{
  flex:0 0 7%;
  min-height:90px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border-top:1px solid var(--grid);
}
  .footer-section{
     padding:.75vh 1.7vw;
    min-width:0;
    border-right:1px solid var(--grid);
  }
  .footer-section:last-child{border-right:0}
  .footer-section.dark{
    background:var(--black);
    color:white;
  }
  .footer-title{
    color:var(--blue);
    font-family: Arvo, serif;
    font-size:clamp(1rem,1.8vw,2.1rem);
    line-height:1;
    margin-bottom:.3vh;
    text-transform:uppercase;
    letter-spacing:.01em;
  }
  .dark .footer-title{color:var(--blue)}
  .today-date{
    color:#ddd;
    font-size:clamp(.65rem,1.1vw,1.25rem);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .today-events{
    margin-top:.3vh;
    display:grid;
    gap:.35vh;
  }
  .today-event{
    font-size:clamp(.58rem,.9vw,1rem);
    line-height:1.15;
  }
  .today-event strong{color:white}
  .upcoming-list{
    display:grid;
    gap:.35vh;
    max-height:80%;
    overflow:hidden;
  }
  .upcoming-item{
    display:flex;
    gap:.65vw;
    font-size:clamp(.55rem,.9vw,1rem);
    line-height:1.1;
  }
.upcoming-date{
  color:var(--blue);
  font-weight:800;
  min-width:5em;
  flex-shrink:0;
}
  .legend{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.6vh .8vw;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:.45vw;
    font-size:clamp(.5rem,.85vw,.95rem);
  }
  .dot{
    width:clamp(9px,.75vw,16px);
    height:clamp(9px,.75vw,16px);
    border-radius:50%;
    flex:none;
  }
  .dot.meeting{background:var(--blue)}
  .dot.brainstorm{background:var(--teal)}
  .dot.special{background:var(--light-teal)}
  .dot.crosspoint{background:var(--gold)}
  .dot.deadline{background:var(--coral)}
  .dot.leave{background:var(--green)}


  /* Wide/landscape screens: use a 3-column dashboard. */
@media (orientation: landscape) and (min-width: 700px){
  body{overflow:auto}
  .screen{height:auto;min-height:100vh}
  .header{flex:0 0 13vh;min-height:76px}
  
  /* Restrict the brand box width on landscape displays to maintain a centered aspect ratio */
  .brand {
    width: min(52vw, 560px);
    height: 75%;
  }

  .months{
    padding:2vh 2.2vw 1.2vh;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:1.5vw;
    align-items:stretch;
  }
  .month.current,.month.future{flex:initial;min-height:520px}
  .month-title,.month.future .month-title{
    font-size:clamp(1.35rem,2.4vw,2.7rem);
  }
  .weekday-row{min-height:22px}
  .weekday{font-size:clamp(.5rem,.8vw,.85rem)}
  .calendar-grid{min-height:420px}
  .day{padding:6px 5px}
  .day-number{font-size:clamp(.8rem,1.3vw,1.35rem)}
  .today-label{font-size:clamp(.4rem,.55vw,.65rem)}
  .event{font-size:clamp(.42rem,.68vw,.78rem);border-left-width:4px}
  .footer{
    flex:initial;
    min-height:150px;
    grid-template-columns:1fr 1fr 1fr;
  }
  .footer-title{font-size:clamp(1rem,1.6vw,1.6rem)}
  .today-date,.today-event,.upcoming-item,.legend-item{font-size:clamp(.55rem,.8vw,.85rem)}
}

  /* Portrait screens: optimized for the 65" TV, while still scaling down cleanly. */
@media (orientation: portrait){
  .brand {
    width: min(58vw, 620px);
    height: 72%;
  }
  .months{overflow:hidden}
  }

  /* Small landscape laptops: keep all three months usable without huge vertical scrolling. */
  @media (orientation: landscape) and (min-width:700px) and (max-height:800px){
    .header{flex-basis:16vh}
    .months{
      grid-template-columns:repeat(3,minmax(0,1fr));
      padding-top:2vh;
    }
    .month.current,.month.future{min-height:0}
    .calendar-grid{min-height:calc(100vh - 360px)}
    .footer{min-height:135px}
    .event{font-size:clamp(.38rem,.62vw,.7rem)}
  }

  /* Narrow/tall screens: keep the stacked design readable. */
  @media (orientation: portrait) and (max-width:700px){
    body{overflow:auto}
    .screen{height:auto;min-height:100vh}
    .header{min-height:90px}
    .months{overflow:visible}
    .month.current,.month.future{min-height:420px}
    .footer{grid-template-columns:1fr;min-height:auto}
    .footer-section{min-height:150px;border-right:0;border-bottom:1px solid var(--grid)}
  }

    .month-title,
.month.future .month-title{
  color:var(--blue);
}
    
</style>
</head>
<body>
<div class="screen">
  <header class="header">
    <div class="brand"><img class="brand-logo" src="https://i.postimg.cc/hvNxvCVH/Crosspoint-Creative.png" alt="Crosspoint Creative"></div><div class="blue-rule"></div>
  </header>

 <main class="months" id="months"></main>

  <footer class="footer">
    <section class="footer-section dark">
      <div class="footer-title">Today</div>
      <div class="today-date" id="todayDate"></div>
      <div class="today-events" id="todayEvents"></div>
    </section>

    <section class="footer-section">
      <div class="footer-title">Upcoming Events</div>
      <div class="upcoming-list" id="upcoming"></div>
    </section>

    <section class="footer-section">
      <div class="footer-title">Event Categories</div>
      <div class="legend">
        <div class="legend-item"><span class="dot meeting"></span>Meeting</div>
        <div class="legend-item"><span class="dot brainstorm"></span>Brainstorm</div>
        <div class="legend-item"><span class="dot special"></span>Special Event</div>
        <div class="legend-item"><span class="dot crosspoint"></span>Crosspoint Event</div>
        <div class="legend-item"><span class="dot deadline"></span>Deadline</div>
        <div class="legend-item"><span class="dot leave"></span>Leave</div>
      </div>
    </section>
  </footer>
</div>

<script>
/*
  VERSION 2:
  The layout is responsive: portrait screens use the TV-style stacked layout;
  landscape screens use a three-column meeting/laptop layout.

  VERSION 1:
  These are fake events. Later, this array will be replaced by Outlook/Microsoft
  calendar data. The visual design will not need to change.
*/
let events = [];

async function loadEvents() {
  try {
    const response = await fetch(
      `events.json?ts=${Date.now()}`,
      { cache: "no-store" }
    );

    events = await response.json();
    render();

  } catch (error) {
    console.error("Error loading events:", error);
  }
}

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}

function eventOccursOnDate(event, dateKey) {
  return (
    dateKey >= event.startDate &&
    dateKey <= event.endDate
  );
}

function renderMonth(year, month, current){
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const el = document.createElement("section");
  el.className = "month " + (current ? "current" : "future");

  const title = document.createElement("h2");
  title.className = "month-title";
  title.textContent = `${monthNames[month].toUpperCase()} ${year}`;
  el.appendChild(title);

  const weekdays = document.createElement("div");
  weekdays.className = "weekday-row";
  ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(d=>{
    const x=document.createElement("div");
    x.className="weekday";
    x.textContent=d;
    weekdays.appendChild(x);
  });
  el.appendChild(weekdays);

  const grid=document.createElement("div");
  grid.className="calendar-grid";

  const first = new Date(year,month,1);
  const daysInMonth = new Date(year,month+1,0).getDate();
  const leading = first.getDay();
  const totalCells = Math.ceil((leading + daysInMonth)/7)*7;
const weekCount = totalCells / 7;

grid.style.gridTemplateRows = Array.from(
  { length: weekCount },
 () => "1.5fr repeat(4, .45fr) .9fr"
).join(" ");
  const today = new Date();
  today.setHours(0,0,0,0);

  for(let i=0;i<totalCells;i++){
    const dayNum=i-leading+1;
    const cell=document.createElement("div");
    cell.className="day";
      cell.style.gridColumn = (i % 7) + 1;
const week = Math.floor(i / 7);
cell.style.gridRow = `${(week * 6) + 1} / span 6`;

    if(dayNum<1 || dayNum>daysInMonth){
      cell.classList.add("other-month");
      grid.appendChild(cell);
      continue;
    }

    const d=new Date(year,month,dayNum);
    const dateKey=iso(d);

    const num=document.createElement("div");
    num.className="day-number";
    num.textContent=dayNum;
    cell.appendChild(num);

    if(d.getTime()===today.getTime()){
      cell.classList.add("today");
      const label=document.createElement("div");
      label.className="today-label";
      label.textContent="Today";
      cell.appendChild(label);
    }

    grid.appendChild(cell);
    }

// ==========================================
// SHARED EVENT TRACKS
// Single-day and multi-day events use
// the same 4 lanes within each calendar week.
// ==========================================

const MAX_LANES = 4;
const weekLanes = Array.from(
  { length: weekCount },
  () => Array.from({ length: MAX_LANES }, () => [])
);

// Build event segments for this visible month.
const eventSegments = [];

events.forEach(e => {
  const eventStart = new Date(e.startDate + "T00:00:00");
  const eventEnd = new Date(e.endDate + "T00:00:00");

  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month + 1, 0);

  // Event doesn't touch this month.
  if (eventEnd < monthStart || eventStart > monthEnd) return;

  const clippedStart =
    eventStart < monthStart ? new Date(monthStart) : new Date(eventStart);

  const clippedEnd =
    eventEnd > monthEnd ? new Date(monthEnd) : new Date(eventEnd);

  let segmentStart = new Date(clippedStart);

  while (segmentStart <= clippedEnd) {
    const daysUntilSaturday = 6 - segmentStart.getDay();

    let segmentEnd = new Date(segmentStart);
    segmentEnd.setDate(segmentEnd.getDate() + daysUntilSaturday);

    if (segmentEnd > clippedEnd) {
      segmentEnd = new Date(clippedEnd);
    }

    const startIndex =
      leading + segmentStart.getDate() - 1;

    const endIndex =
      leading + segmentEnd.getDate() - 1;

    const week = Math.floor(startIndex / 7);

    eventSegments.push({
      event: e,
      week,
      startIndex,
      endIndex,
      startColumn: (startIndex % 7) + 1,
      endColumn: (endIndex % 7) + 2,
      isMultiDay: e.startDate !== e.endDate
    });

    segmentStart = new Date(segmentEnd);
    segmentStart.setDate(segmentStart.getDate() + 1);
  }
});

// Multi-day events get first choice of lanes.
// Then all-day single events.
// Then timed events chronologically.
eventSegments.sort((a, b) => {
  if (a.week !== b.week) {
    return a.week - b.week;
  }

  if (a.isMultiDay !== b.isMultiDay) {
    return a.isMultiDay ? -1 : 1;
  }

  const aHasTime = !!a.event.time;
  const bHasTime = !!b.event.time;

  if (aHasTime !== bHasTime) {
    return aHasTime ? 1 : -1;
  }

  if (a.event.time && b.event.time) {
    const timeCompare =
      new Date(`1970-01-01 ${a.event.time}`) -
      new Date(`1970-01-01 ${b.event.time}`);

    if (timeCompare !== 0) return timeCompare;
  }

  return a.startIndex - b.startIndex;
});

// Keep track of events that couldn't fit.
const hiddenByDay = new Map();

eventSegments.forEach(segment => {
  const {
    event: e,
    week,
    startIndex,
    endIndex,
    startColumn,
    endColumn,
    isMultiDay
  } = segment;

  let chosenLane = -1;

  // Find the first lane that is free across
  // every day this event occupies.
  for (let lane = 0; lane < MAX_LANES; lane++) {
    const conflicts = weekLanes[week][lane].some(existing =>
      !(
        endIndex < existing.startIndex ||
        startIndex > existing.endIndex
      )
    );

    if (!conflicts) {
      chosenLane = lane;
      break;
    }
  }

  // No room in our four visible lanes.
  if (chosenLane === -1) {
    for (let idx = startIndex; idx <= endIndex; idx++) {
      hiddenByDay.set(
        idx,
        (hiddenByDay.get(idx) || 0) + 1
      );
    }
    return;
  }

  weekLanes[week][chosenLane].push({
    startIndex,
    endIndex
  });

  const item = document.createElement("div");

  item.className =
    `${isMultiDay ? "multi-span" : "event"} ${e.type}`;

  item.style.gridColumn =
    `${startColumn} / ${endColumn}`;

  // Each calendar week has:
  // row 1 = date/header
  // rows 2–5 = our four event lanes
  // row 6 = +more
  item.style.gridRow =
    (week * 6) + 2 + chosenLane;

  item.title = e.time
    ? `${e.time} — ${e.title}`
    : e.title;

 const content = document.createElement("span");
content.className = "event-content";

if (!isMultiDay && e.time) {
  content.innerHTML =
    `<span class="time">${e.time}</span> ${e.title}`;
} else {
  content.textContent = e.title;
}

item.appendChild(content);

  grid.appendChild(item);
});

// Add "+ more" to days with hidden events.
hiddenByDay.forEach((count, index) => {
  const more = document.createElement("div");
  more.className = "more";
  more.textContent = `+${count} more`;

  const week = Math.floor(index / 7);
  const column = (index % 7) + 1;

  more.style.gridColumn = column;
  more.style.gridRow = (week * 6) + 6;

  grid.appendChild(more);
});
    
el.appendChild(grid);
    return el;
}

function render(){
  const now=new Date();
  now.setHours(0,0,0,0);
  const months=document.getElementById("months");
  months.innerHTML="";

  for(let offset=0;offset<3;offset++){
    const d=new Date(now.getFullYear(),now.getMonth()+offset,1);
    months.appendChild(renderMonth(d.getFullYear(),d.getMonth(),offset===0));
  }

  const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("todayDate").textContent =
    `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][now.getDay()]}, ${monthNames[now.getMonth()]} ${now.getDate()}`;

  const todayKey=iso(now);
  const todayEvents = events
  .filter(e => eventOccursOnDate(e, todayKey))
  .sort((a, b) => {
    if (!a.time) return -1;
    if (!b.time) return 1;

    return new Date(`1970-01-01 ${a.time}`) -
           new Date(`1970-01-01 ${b.time}`);
  });
  const todayBox=document.getElementById("todayEvents");
  todayBox.innerHTML="";
  if(todayEvents.length===0){
    todayBox.innerHTML='<div class="today-event">No scheduled events.</div>';
  } else {
    todayEvents.forEach(e=>{
      const x=document.createElement("div");
      x.className="today-event";
      if (e.allDay || e.startDate !== e.endDate) {
  x.innerHTML = `<strong>All Day</strong> — ${e.title}`;
} else {
  x.innerHTML =
    `<strong>${e.time}</strong> — ${e.title}`;
}
      todayBox.appendChild(x);
    });
  }

  const upcoming = document.getElementById("upcoming");
upcoming.innerHTML = "";

const visibleUpcomingTypes = [
  "crosspoint event",
  "special event",
  "brainstorm",
  "leave"
];

const future = events
  .filter(e =>
    e.endDate >= todayKey &&
    visibleUpcomingTypes.includes(e.type)
  )
  .sort((a, b) => a.startDate.localeCompare(b.startDate))
  .slice(0, 5);

future.forEach(e => {
  const item = document.createElement("div");
  item.className = "upcoming-item";

  function localDate(dateString) {
    const [year, month, day] = dateString.split("-").map(Number);
    return new Date(year, month - 1, day);
  }

  const start = localDate(e.startDate);
  const end = localDate(e.endDate);

  let displayDate;

  if (e.startDate !== e.endDate) {
    const startMonth = start.toLocaleDateString("en-US", {
      month: "short"
    });

    const endMonth = end.toLocaleDateString("en-US", {
      month: "short"
    });

    if (start.getMonth() === end.getMonth()) {
      displayDate = `${startMonth} ${start.getDate()}–${end.getDate()}`;
    } else {
      displayDate = `${startMonth} ${start.getDate()}–${endMonth} ${end.getDate()}`;
    }
  } else {
    displayDate = start.toLocaleDateString("en-US", {
      month: "short",
      day: "numeric"
    });
  }

  item.innerHTML = `
    <span class="upcoming-date">${displayDate}</span>
    <span>${e.title}</span>
  `;

  upcoming.appendChild(item);
});
}
loadEvents();

setInterval(() => {
  loadEvents();
}, 60000);
</script>
</body>
</html>
